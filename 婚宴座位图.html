    font-size: 16px;
    background: rgba(255, 215, 0, 0.15);
    padding: 4px 14px;
    border-radius: 20px;
    white-space: nowrap;
    justify-self: center;
    text-align: center;
    min-width: 56px;
  }

  .guest-row-btn {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #8B0000;
    border: none;
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 2px;
    box-shadow: 0 3px 12px rgba(255, 215, 0, 0.3);
    justify-self: end;
    transition: all 0.2s ease;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .guest-row-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 18px rgba(255, 215, 0, 0.45);
  }

  .guest-row-btn:active {
    transform: translateY(0);
  }

  .guest-row-btn.active {
    background: linear-gradient(135deg, #FFF, #FFE4B5);
    color: #8B0000;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
  }

  /* 页脚 */
  .browse-footer {
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 2px;
    flex-shrink: 0;
  }

  /* 滚动条样式 */
  .guest-list-all::-webkit-scrollbar {
    width: 8px;
  }

  .guest-list-all::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }

  .guest-list-all::-webkit-scrollbar-thumb {
    background: rgba(255, 215, 0, 0.3);
    border-radius: 4px;
  }

  .guest-list-all::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 215, 0, 0.5);
  }

  .browse-map {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.2);
    border-radius: 20px;
    padding: 30px 40px;
    width: 100%;
  }

  .browse-map-stage {
    text-align: center;
    margin-bottom: 24px;
  }

  .browse-map-stage-label {
    display: inline-block;
    padding: 8px 40px;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #8B0000;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 6px;
    border-radius: 6px;
  }

  .browse-map-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 16px;
  }

  .browse-map-table {
    aspect-ratio: 1;
    max-width: 120px;
    margin: 0 auto;
    width: 100%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 215, 0, 0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 600;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .browse-map-table .map-table-sub {
    font-size: 12px;
    font-weight: 400;
    margin-top: 2px;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  .browse-map-table.active {
    background: linear-gradient(145deg, #FFE4B5, #FFD700);
    border-color: #FFD700;
    color: #8B0000;
    box-shadow: 0 0 40px rgba(255, 215, 0, 0.7);
    transform: scale(1.2);
    z-index: 2;
    animation: tablePulse 1.5s ease-in-out infinite;
  }

  @keyframes tablePulse {
    0%, 100% {
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }
    50% {
      box-shadow:
        0 0 20px rgba(255, 215, 0, 0.8),
        0 0 60px rgba(255, 215, 0, 0.6),
        0 0 90px rgba(255, 215, 0, 0.3);
    }
  }

  .browse-map-table.active .map-table-sub {
    color: #8B4513;
    opacity: 0.8;
  }

  .browse-map-table.head {
    border-color: rgba(255, 215, 0, 0.6);
    border-width: 3px;
  }

  /* 大屏16:9优化 */
  @media (min-width: 1600px) {
    .browse-split {
      max-width: 1600px;
      gap: 80px;
    }
    .browse-couple { font-size: 38px; }
    .guest-row-name { font-size: 24px; }
    .guest-row-btn { font-size: 16px; padding: 10px 22px; }
    .guest-row-count { font-size: 17px; }
    .browse-map-table { max-width: 140px; font-size: 22px; }
    .selected-table-big { font-size: 100px; }
    .selected-guest-name { font-size: 30px; }
  }

  /* 手机竖屏适配 */
  @media (max-aspect-ratio: 4/5), (max-width: 600px) {
    .browse-mode {
      height: auto;
      min-height: 100vh;
      padding: 20px 16px;
      overflow: visible;
    }
    .browse-split {
      grid-template-columns: 1fr;
      gap: 20px;
      height: auto;
    }
    .browse-left {
      height: auto;
      overflow: visible;
      order: 2;
    }
    .browse-right {
      height: auto;
      overflow: visible;
      order: 1;
    }
    .browse-page-title { margin-bottom: 12px; }
    .browse-couple { font-size: 24px; letter-spacing: 4px; }
    .browse-couple .amp { font-size: 18px; margin: 0 8px; }
    .browse-welcome { font-size: 11px; letter-spacing: 2px; }
    .browse-left-hint { font-size: 15px; letter-spacing: 2px; margin-bottom: 12px; }
    .guest-row { gap: 10px; padding: 10px 0; }
    .guest-row-name { font-size: 18px; letter-spacing: 1px; }
    .guest-row-count { font-size: 13px; padding: 3px 10px; }
    .guest-row-btn { font-size: 13px; padding: 7px 14px; letter-spacing: 1px; }
    .guest-list-all { max-height: none; flex: none; }
    .selected-info { min-height: auto; padding: 10px 0; }
    .selected-table-big { font-size: 56px; }
    .selected-guest-name { font-size: 20px; }
    .selected-table-label { font-size: 15px; }
    .selected-placeholder { font-size: 15px; padding: 18px 24px; letter-spacing: 2px; }
    .browse-map-title { font-size: 14px; letter-spacing: 3px; }
    .browse-map { padding: 20px 24px; }
    .browse-map-stage-label { padding: 6px 24px; font-size: 14px; letter-spacing: 4px; }
    .browse-map-table { max-width: 60px; font-size: 14px; }
    .browse-map-table .map-table-sub { font-size: 9px; }
    .browse-footer { font-size: 12px; margin-top: 10px; }
    .seat-modal { padding: 24px 20px; max-width: 100%; }
    .seat-modal-guest { font-size: 20px; }
    .seat-modal-table-big { font-size: 52px; }
    .seat-modal-table-label { font-size: 15px; }
    .seat-modal-map-title { font-size: 14px; letter-spacing: 3px; }
    .seat-modal-map { padding: 14px 16px; }
    .seat-modal-stage-label { padding: 5px 24px; font-size: 13px; letter-spacing: 4px; }
    .seat-modal-table { font-size: 15px; max-width: 70px; }
    .seat-modal-close { width: 32px; height: 32px; font-size: 16px; top: 12px; right: 14px; }
    .seat-modal-grid { gap: 12px 6px; }
    .seat-modal-grid > .seat-modal-table:nth-child(3n+2) { transform: translateX(-12px); }
    .seat-modal-grid > .seat-modal-table:nth-child(3n+2).active { transform: scale(1.15) translateX(-12px); }
    .seat-modal-grid > .seat-modal-table[data-modal-table-id="8"],
    .seat-modal-grid > .seat-modal-table[data-modal-table-id="11"] { transform: translateX(-24px); }
    .seat-modal-grid > .seat-modal-table[data-modal-table-id="8"].active,
    .seat-modal-grid > .seat-modal-table[data-modal-table-id="11"].active { transform: scale(1.15) translateX(-24px); }
    .seat-modal-grid > .seat-modal-table[data-modal-table-id="2"] { transform: translateX(0); }
    .seat-modal-grid > .seat-modal-table[data-modal-table-id="2"].active { transform: scale(1.15); }
    .seat-modal-grid-stage-label { font-size: 12px; padding: 6px 10px; max-height: 80px; }
    .seat-modal-grid-elevator-label { font-size: 12px; padding: 5px 12px; }
  }

  /* 小屏横屏（手机横过来） */
  @media (max-aspect-ratio: 5/4) and (min-aspect-ratio: 4/5) {
    .browse-mode { padding: 20px 30px; }
    .browse-couple { font-size: 22px; letter-spacing: 4px; }
    .guest-row { padding: 8px 0; gap: 10px; }
    .guest-row-name { font-size: 16px; }
    .guest-row-btn { font-size: 12px; padding: 6px 12px; }
    .guest-row-count { font-size: 12px; padding: 3px 10px; }
    .selected-table-big { font-size: 56px; }
    .selected-guest-name { font-size: 20px; }
    .browse-map-table { max-width: 80px; font-size: 16px; }
  }
</style>
</head>
<body>
  <!-- 浏览模式（直接作为首页） -->
  <div class="browse-mode active" id="browseMode">
    <div class="browse-split">
      <!-- 左侧 - 宾客清单 -->
      <div class="browse-left">
        <!-- 标题 -->
        <div class="browse-page-title">
          <div class="browse-couple">今晚坐哪里呢？</div>
        </div>

        <div class="browse-left-hint">
          找到您的名字，点击 <strong>「查看桌号」</strong>
        </div>

        <div class="guest-list-wrap">
          <div class="guest-list-header">
            <span class="hdr-name">姓名</span>
            <span class="hdr-count">人数</span>
            <span class="hdr-action">桌号</span>
          </div>
          <div class="guest-list-all" id="guestListAll">
            <!-- 由JS填充 -->
          </div>
        </div>

        <div class="browse-footer">如有任何疑问，请咨询现场迎宾人员</div>
      </div>
    </div>
  </div>

  <!-- 桌位分布弹窗 -->
  <div class="seat-modal-mask" id="seatModal" onclick="closeModal(event)">
    <div class="seat-modal" onclick="event.stopPropagation()">
      <button class="seat-modal-close" onclick="closeSeatModal()" title="关闭">✕</button>
      <div class="seat-modal-header">
        <div class="seat-modal-guest" id="modalGuestName"></div>
        <div class="seat-modal-table-label" id="modalTableLabel"></div>
        <div class="seat-modal-table-big" id="modalTableBig"></div>
      </div>
      <div class="seat-modal-map-title">现场桌位分布</div>
      <div class="seat-modal-map">
        <div class="seat-modal-stage">
          <div class="seat-modal-stage-label">西湖（保俶塔）</div>
        </div>
        <div class="seat-modal-grid" id="modalTableGrid">
          <!-- 由JS填充 -->
        </div>
        <div class="seat-modal-elevator-row">
          <div class="seat-modal-grid-elevator-label">电 梯</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // ============================================================
  //  座位数据 —— 请根据实际情况修改此部分
  // ============================================================
  // 每桌数据：
  //   id: 桌号
  //   name: 桌名/类型（如"主桌"、"娘家桌"等，没有则留空字符串）
  //   isHead: 是否为主桌（true/false）
  //   guests: 宾客数组，每项格式为 { name: "主宾姓名", family: 家属人数（不含本人） }
  // ============================================================

  const tablesData = [
    {
      id: 1,
      name: "",
      isHead: true,
      guests: [
        { name: "小吴小婶", family: 0 },
        { name: "吴小毛", family: 1 },
        { name: "吴刘应", family: 1 },
        { name: "小吴大姨", family: 0 },
        { name: "小吴舅妈", family: 0 },
        { name: "叶翔", family: 1 },
        { name: "杨善鹏", family: 1 },
      ]
    },
    {
      id: 2,
      name: "",
      isHead: false,
      guests: [
        { name: "小吴小叔", family: 0 },
        { name: "小吴大妈", family: 0 },
        { name: "梁成龙", family: 1 },
      ]
    },
    {
      id: 3,
      name: "",
      isHead: false,
      guests: [
        { name: "沈凤仙", family: 6 },
        { name: "沈豪君", family: 1 },
      ]
    },
    {
      id: 4,
      name: "",
      isHead: false,
      guests: [
        { name: "郑德珍", family: 3 },
        { name: "丽君", family: 4 },
      ]
    },
    {
      id: 5,
      name: "",
      isHead: false,
      guests: [
        { name: "桢裕", family: 4 },
        { name: "桢华", family: 4 },
      ]
    },
    {
      id: 6,
      name: "",
      isHead: false,
      guests: [
        { name: "曹鹏", family: 3 },
        { name: "曹伟", family: 2 },
        { name: "陆祥康", family: 2 },
      ]
    },
    {
      id: 7,
      name: "",
      isHead: false,
      guests: [
        { name: "葛秋菊", family: 0 },
        { name: "李鹏", family: 0 },
        { name: "漓江", family: 0 },
        { name: "吴佳志", family: 1 },
        { name: "谢秋薇", family: 0 },
        { name: "冯佳倩", family: 0 },
        { name: "吴雅雯", family: 0 },
        { name: "梁沨超程", family: 1 },
      ]
    },
    {
      id: 8,
      name: "",
      isHead: false,
      guests: [
        { name: "赵晗", family: 0 },
        { name: "顾佳佳", family: 2 },
        { name: "陈娜", family: 0 },
        { name: "陈佳", family: 0 },
        { name: "周梦杰", family: 0 },
        { name: "徐吉莉", family: 1 },
      ]
    },
    {
      id: 9,
      name: "",
      isHead: false,
      guests: [
        { name: "陈龙根", family: 1 },
        { name: "金关荣", family: 1 },
        { name: "宋荣根", family: 1 },
        { name: "祝军", family: 1 },
        { name: "纪刚", family: 1 },
      ]
    },
    {
      id: 10,
      name: "",
      isHead: false,
      guests: [
        { name: "高震", family: 0 },
        { name: "陈浩", family: 1 },
        { name: "张佳雯", family: 1 },
        { name: "吴熙", family: 1 },
        { name: "叶婷婷", family: 1 },
        { name: "谭文瑾", family: 0 },
      ]
    },
    {
      id: 11,
      name: "",
      isHead: false,
      guests: [
        { name: "徐国琴", family: 1 },
        { name: "张建萍", family: 1 },
        { name: "来爱云", family: 2 },
        { name: "陶志强", family: 0 },
        { name: "周伟", family: 1 },
      ]
    }
  ];

  // ============================================================
  //  以下为页面逻辑，一般不需要修改
  // ============================================================

  // 把所有宾客打平成一个数组，带上桌号信息
  const allGuests = [];
  tablesData.forEach(table => {
    table.guests.forEach(guest => {
      allGuests.push({
        name: guest.name,
        family: guest.family,
        total: guest.family + 1,
        tableId: table.id,
        tableName: table.name,
        isHead: table.isHead
      });
    });
  });
  allGuests.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN'));

  // 渲染弹窗里的桌位分布图
  function renderModalMap() {
    const grid = document.getElementById('modalTableGrid');
    let html = '';
    const layout = [
      [1, 2, 3],
      [4, 5, 'stage'],
      [6, 7, 8],
      [9, 10, 11]
    ];
    layout.forEach(row => {
      row.forEach(cell => {
        if (cell === 'stage') {
          html += `<div class="seat-modal-grid-stage"><div class="seat-modal-grid-stage-label">舞 台</div></div>`;
        } else if (cell === 'elevator') {
          html += `<div class="seat-modal-grid-elevator"><div class="seat-modal-grid-elevator-label">电 梯</div></div>`;
        } else {
          const table = tablesData.find(t => t.id === cell);
          if (table) {
            html += `<div class="seat-modal-table ${table.isHead ? 'head' : ''}" data-modal-table-id="${table.id}">${table.id}号</div>`;
          }
        }
      });
    });
    grid.innerHTML = html;
  }

  // 高亮弹窗里的桌子
  function highlightModalTable(tableId) {
    document.querySelectorAll('.seat-modal-table').forEach(el => {
      if (parseInt(el.dataset.modalTableId) === tableId) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
  }

  // 渲染左侧宾客清单
  function renderGuestList() {
    const list = document.getElementById('guestListAll');
    list.innerHTML = allGuests.map((g, idx) => `
      <div class="guest-row" data-guest-idx="${idx}">
        <span class="guest-row-name">${g.name}</span>
        <span class="guest-row-count">${g.total}人</span>
        <button class="guest-row-btn" onclick="showSeat(${idx})">查看桌号</button>
      </div>
    `).join('');
  }

  // 点击查看桌号 - 弹出弹窗
  function showSeat(idx) {
    const guest = allGuests[idx];

    // 填充弹窗内容
    document.getElementById('modalGuestName').textContent = guest.name + ' 您好';
    document.getElementById('modalTableBig').textContent = guest.tableId + '号桌';
    document.getElementById('modalTableLabel').innerHTML =
      guest.total === 1
        ? '您被安排于'
        : '您一行 <span style="color:#fff;font-weight:600;">' + guest.total + '</span> 人安排于';

    // 高亮对应桌子
    highlightModalTable(guest.tableId);

    // 显示弹窗
    const modal = document.getElementById('seatModal');
    modal.classList.add('show');
  }

  // 关闭弹窗（点遮罩）
  function closeModal(e) {
    if (e.target.id === 'seatModal') {
      closeSeatModal();
    }
  }

  // 关闭弹窗
  function closeSeatModal() {
    const modal = document.getElementById('seatModal');
    modal.classList.remove('show');
  }

  // ESC 键关闭弹窗
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeSeatModal();
    }
  });

  // 初始化
  renderModalMap();
  renderGuestList();
</script>
</body>
</html>
